[package]
name = "dawn-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tools integrating ZeroClaw with the Dawn SaaS (file storage, etc.)."
publish = false

[dependencies]
zeroclaw-api.workspace = true
zeroclaw-config = { workspace = true, default-features = true }
zeroclaw-log.workspace = true
anyhow = "1.0"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls-webpki-roots-no-provider", "__rustls-ring", "stream"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tokio = { version = "1.50", default-features = false, features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"] }
urlencoding = "2.1"
uuid = { version = "1.22", default-features = false, features = ["v4", "std"] }

[dev-dependencies]
tempfile = "3.26"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
