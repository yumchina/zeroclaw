[alias]
mdbook = "run --release -p xtask --bin mdbook --"
fluent = "run --release -p xtask --bin fluent --"
web = "run --release -p xtask --bin web --"
generate = "run --release -p xtask --bin generate --"

# yumclaw release builds — shared feature surface, with vs without the
# bundled web console. Both produce `--release` binaries; the suffix
# describes which artefact, not which cargo profile.
# Run via `cargo yumclaw-web` / `cargo yumclaw-prd`.
#
# Surface (both):
# - agent-runtime / gateway / schema-export          core daemon + JSON-schema export
# - plugins-wasm + plugins-wasm-cranelift            WASM plugins + Cranelift JIT (matches the
#                                                    pre-0.8.0 `plugins-wasm` behaviour, which
#                                                    no longer pulls a backend on its own)
# - observability-prometheus                         /metrics endpoint
# - channel-feishu / channel-dawnIM + dawn-tools     IM channels in production use
# - channel-wecom-ws                                 企业微信 WebSocket 长连接
# - browser-native / rag-pdf                         browser tool + PDF RAG
#
# yumclaw-web only:
# - embedded-web                                     bake web/dist/ into the binary so the
#                                                    web console works from a single
#                                                    redistributable executable. Off in prd
#                                                    where the dashboard is hosted separately
#                                                    (or behind its own reverse proxy) and
#                                                    bundling adds binary size for no gain.
yumclaw-web = "build --release --features agent-runtime,gateway,schema-export,plugins-wasm,plugins-wasm-cranelift,observability-prometheus,channel-feishu,channel-dawnIM,dawn-tools,channel-wecom-ws,browser-native,rag-pdf,embedded-web"
yumclaw-prd = "build --release --features agent-runtime,gateway,schema-export,plugins-wasm,plugins-wasm-cranelift,observability-prometheus,channel-feishu,channel-dawnIM,dawn-tools,channel-wecom-ws,browser-native,rag-pdf"

[build]
rustdocflags = ["--default-theme=ayu"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "link-arg=-static"]

# ARM64 Linux (Raspberry Pi 4/5, AWS Graviton, etc.)
# Prerequisite: aarch64-linux-gnu-gcc must be installed.
#   Arch:   sudo pacman -S aarch64-linux-gnu-gcc
#   Debian: sudo apt install gcc-aarch64-linux-gnu
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "link-arg=-static", "-C", "link-arg=-Wl,-z,stack-size=8388608"]

# Windows targets
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608"]

[target.i686-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:8388608"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-arg=-Wl,--stack,8388608"]

# Android targets (NDK toolchain)
[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi21-clang"

[target.aarch64-linux-android]
linker = "aarch64-linux-android21-clang"
rustflags = ["-C", "link-arg=-Wl,-z,stack-size=8388608"]
